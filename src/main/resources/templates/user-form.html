<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'create'} ? 'Create User' : 'Edit User'"></title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        form { display: grid; gap: .8rem; max-width: 420px; }
        label { font-weight: 600; }
        input { padding: .4rem .6rem; border: 1px solid #ccc; }
        .actions { display:flex; gap:.5rem; }
        a.button, button { padding:.4rem .8rem; border:1px solid #ccc; background:#fafafa; cursor:pointer; text-decoration:none; }
    </style>
</head>
<body>
<h1 th:text="${mode == 'create'} ? 'Create User' : 'Edit User'"></h1>

<form th:object="${user}" th:action="${mode == 'create'} ? @{/users} : @{'/users/' + ${user.userId}}" method="post">
    <div>
        <label>Username</label><br>
        <input type="text" th:field="*{username}" required>
    </div>
    <div>
        <label>Email</label><br>
        <input type="email" th:field="*{email}" required>
    </div>
    <div>
        <label>Password</label><br>
        <input type="text" th:field="*{passwordHash}" required>
    </div>

    <div class="actions">
        <button type="submit" th:text="${mode == 'create'} ? 'Create' : 'Save'"></button>
        <a class="button" th:href="@{/users}">Cancel</a>
    </div>
</form>
</body>
</html>
