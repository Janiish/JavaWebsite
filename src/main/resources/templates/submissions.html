<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submissions</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f5f5f5; text-align: left; }
        .actions { display: flex; gap: .5rem; }
        .topbar { display:flex; justify-content: space-between; align-items:center; margin-bottom:1rem; }
        a.button, button { padding:.4rem .8rem; border:1px solid #ccc; background:#fafafa; cursor:pointer; text-decoration:none; }
    </style>
</head>
<body>
<div class="topbar">
    <h1>Submissions</h1>
    <a class="button" th:href="@{/submissions/new}">New Submission</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Problem</th>
        <th>Status</th>
        <th>Created</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${submissions.content}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.user != null ? s.user.username : 'N/A'}"></td>
        <td th:text="${s.problem != null ? s.problem.title : 'N/A'}"></td>
        <td th:text="${s.status}"></td>
        <td th:text="${#temporals.format(s.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
</table>

<div style="margin-top:1rem;">
    <span th:text="'Page ' + ${submissions.number + 1} + ' of ' + ${submissions.totalPages}"></span>
    <div style="float:right; display:flex; gap:.5rem;">
        <a class="button" th:if="${submissions.hasPrevious()}" th:href="@{'/submissions'(page=${submissions.number - 1},size=${size})}">Prev</a>
        <a class="button" th:if="${submissions.hasNext()}" th:href="@{'/submissions'(page=${submissions.number + 1},size=${size})}">Next</a>
    </div>
</div>
</body>
</html>
